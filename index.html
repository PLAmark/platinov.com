<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A9FF0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="PLATINOV SHOP — покупка и продажа виртов">
  <title>Платинов Store</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css?v=271">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <defs>
      <linearGradient id="flame-warm-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff4f00"></stop>
        <stop offset="58%" stop-color="#ff9200"></stop>
        <stop offset="100%" stop-color="#ffc817"></stop>
      </linearGradient>
    </defs>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"></path>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6"></path>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"></path>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h14"></path>
      <path d="m13 6 6 6-6 6"></path>
    </symbol>
    <symbol id="icon-arrow-down" viewBox="0 0 24 24">
      <path d="M12 4v16"></path>
      <path d="m6 14 6 6 6-6"></path>
    </symbol>
    <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
      <path d="M7 17 17 7"></path>
      <path d="M7 7h10v10"></path>
    </symbol>
    <symbol id="icon-receipt" viewBox="0 0 24 24">
      <path d="M4 2v20l2-2 2 2 2-2 2 2 2-2 2 2 2-2 2 2V2l-2 2-2-2-2 2-2-2-2 2-2-2-2 2Z"></path>
      <path d="M9 8h6"></path>
      <path d="M9 12h6"></path>
      <path d="M9 16h4"></path>
    </symbol>
    <symbol id="icon-headset" viewBox="0 0 24 24">
      <path d="M4 14a8 8 0 0 1 16 0"></path>
      <path d="M18 19c0 1.7-1.3 3-3 3h-3"></path>
      <path d="M4 14v3a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 2Z"></path>
      <path d="M20 14v3a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2Z"></path>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 22a8 8 0 0 1 16 0"></path>
    </symbol>
    <symbol id="icon-message-square" viewBox="0 0 24 24">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>
      <path d="M8 9h8"></path>
      <path d="M8 13h5"></path>
    </symbol>
    <symbol id="icon-message-dots" viewBox="0 0 24 24">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>
      <circle cx="8" cy="11" r=".65"></circle>
      <circle cx="12" cy="11" r=".65"></circle>
      <circle cx="16" cy="11" r=".65"></circle>
    </symbol>
    <symbol id="icon-gift" viewBox="0 0 24 24">
      <rect x="3" y="8" width="18" height="13" rx="2"></rect>
      <path d="M12 8v13"></path>
      <path d="M3 12h18"></path>
      <path d="M7.5 8A2.5 2.5 0 1 1 12 6c0 1.1-.9 2-2 2Z"></path>
      <path d="M16.5 8A2.5 2.5 0 1 0 12 6c0 1.1.9 2 2 2Z"></path>
    </symbol>
    <symbol id="icon-shopping-bag" viewBox="0 0 24 24">
      <path d="M6 8h12l1 13H5L6 8Z"></path>
      <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3 2"></path>
    </symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24">
      <path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"></path>
      <path d="M8 6H4v1a4 4 0 0 0 4 4"></path>
      <path d="M16 6h4v1a4 4 0 0 1-4 4"></path>
      <path d="M12 12v5"></path>
      <path d="M8 21h8"></path>
      <path d="M9 17h6v4H9z"></path>
    </symbol>
    <symbol id="icon-flame" viewBox="0 0 24 24">
      <path fill="url(#flame-warm-gradient)" d="M11.4.7c1.7 2.4 2.9 4.9 2.6 7.9-.1.8 0 1.7.5 2.3.8-1.6 1.8-3.3 1.7-4.7 2.5 2.6 3.8 5.6 3.8 9 0 4.7-3.3 7.8-8 7.8-4.6 0-8-2.9-8-7.4 0-3.4 2-6.4 4.4-8.9 1.5-1.6 2.7-3.5 3-6Z"></path>
    </symbol>
    <symbol id="icon-shield-check" viewBox="0 0 24 24">
      <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"></path>
      <path d="m9 12 2 2 4-4"></path>
    </symbol>
    <symbol id="icon-badge-ruble" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M9 16V7h4a3 3 0 0 1 0 6H9"></path>
      <path d="M8 16h6"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14"></path>
      <path d="M5 12h14"></path>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 11v5"></path>
      <path d="M12 8h.01"></path>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="m6 6 12 12"></path>
      <path d="m18 6-12 12"></path>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4L19 6"></path>
    </symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar app-header">
      <button class="icon-button back-button is-hidden" id="backButton" type="button" aria-label="Вернуться назад">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
      </button>
      <button class="brand-button header-brand-pill" type="button" data-route="home" aria-label="На главную">
        <span class="brand-copy">
          <strong>PLATINOV SHOP</strong>
        </span>
      </button>
      <div class="header-actions">
        <button class="header-orders header-pill orders-pill" type="button" data-route="orders" aria-label="Мои заказы">
          <span class="header-orders-icon">
            <svg class="ui-icon" aria-hidden="true"><use href="#icon-receipt"></use></svg>
          </span>
          <span>Заказы</span>
        </button>
        <button class="header-profile-button header-pill" id="headerProfileButton" type="button" data-route="profile" aria-label="Открыть профиль">
          <span class="header-profile-visual" id="headerProfileVisual" aria-hidden="true">
            <svg class="ui-icon header-profile-icon" aria-hidden="true"><use href="#icon-user"></use></svg>
          </span>
        </button>
      </div>
    </header>

    <main id="app" class="app-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <span class="nav-liquid-indicator" aria-hidden="true"></span>
      <button class="nav-item" type="button" data-route="reviews">
        <span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-message-square"></use></svg></span>
        <span>Отзывы</span>
      </button>
      <button class="nav-item" type="button" data-route="raffle">
        <span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-gift"></use></svg></span>
        <span>Розыгрыш</span>
      </button>
      <button class="nav-item nav-order is-active" type="button" data-route="home">
        <span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-shopping-bag"></use></svg></span>
        <span>Оформить</span>
      </button>
      <button class="nav-item" type="button" data-route="support">
        <span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-headset"></use></svg></span>
        <span>Поддержка</span>
      </button>
      <button class="nav-item" type="button" data-route="profile">
        <span class="nav-icon"><svg class="ui-icon" aria-hidden="true"><use href="#icon-user"></use></svg></span>
        <span>Профиль</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js?v=271"></script>
</body>
</html>
